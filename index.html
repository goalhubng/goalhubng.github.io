<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoalHub — Live Football Scores</title>
  <meta name="description" content="Real live football scores, standings, and squads for 40+ leagues worldwide — updated as it happens.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23052e16'/%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='none' stroke='%2322c55e' stroke-width='2'/%3E%3Ctext x='50%25' y='58%25' font-size='34' text-anchor='middle' dominant-baseline='middle'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">

  <!-- PWA: installable home-screen app, standalone (no browser chrome) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="themeColorMeta" content="#06080b">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoalHub">

  <!-- iOS splash screens — Safari has no Android-style auto-generated
       splash from the manifest, so without these it shows a plain
       fallback screen; one entry per common current iPhone screen size
       (portrait only, matching the manifest's orientation lock). -->
  <link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GoalHub">
  <meta property="og:title" content="GoalHub — Live Football Scores">
  <meta property="og:description" content="Real live football scores, standings, and squads for 40+ leagues worldwide — updated as it happens.">
  <meta property="og:image" content="https://goalhub.pages.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://goalhub.pages.dev">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GoalHub — Live Football Scores">
  <meta name="twitter:description" content="Real live football scores, standings, and squads for 40+ leagues worldwide — updated as it happens.">
  <meta name="twitter:image" content="https://goalhub.pages.dev/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Team/league badge CDNs — preconnect so the first badge requests skip
       the DNS+TLS handshake, since ~800 of them load on a typical visit. -->
  <link rel="preconnect" href="https://r2.thesportsdb.com">
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applied before first paint (inline, in <head>) so switching themes
    // doesn't flash the wrong one on load. Default mode is "auto": follow
    // the device's own light/dark setting. Only an explicit Light/Dark pick
    // from the toggle (saved under goalhub_theme_mode) overrides that.
    (function () {
      try {
        var mode = localStorage.getItem("goalhub_theme_mode") || "auto";
        var light = mode === "light" || (mode === "auto" && window.matchMedia("(prefers-color-scheme: light)").matches);
        if (light) {
          document.documentElement.setAttribute("data-theme", "light");
        }
        var meta = document.getElementById("themeColorMeta");
        if (meta) meta.setAttribute("content", light ? "#ffffff" : "#06080b");
      } catch (err) { /* localStorage/matchMedia unavailable — default dark stays */ }
    })();
  </script>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="./" aria-label="GoalHub home">
      <span class="brand-badge">⚽</span>
      <span class="brand-name">Goal<span class="accent">Hub</span></span>
    </a>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search teams or leagues" oninput="searchTeams()" aria-label="Search teams or leagues">
    </div>

    <div class="header-actions">
      <button class="live-pill" id="liveBtn" onclick="jumpToLive()" aria-label="Show live matches">
        <span class="live-dot"></span>LIVE<span class="live-pill-count" id="liveBtnCount"></span>
      </button>
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Theme: automatic (follows your device). Tap to switch to light." title="Theme: automatic (follows your device). Tap to switch to light.">🌓</button>
      <div class="auth-area" id="authArea">
        <button class="auth-btn" id="authBtn" onclick="openAuthModal()">Login</button>
      </div>
    </div>
  </header>

  <!-- INSTALL APP BANNER — shown only when genuinely installable and not
       already dismissed/installed; see script.js's install-banner logic. -->
  <div class="install-banner" id="installBanner" hidden>
    <span class="install-banner-text" id="installBannerText">Install GoalHub for quick access — opens full-screen, no browser bar.</span>
    <div class="install-banner-actions">
      <button class="install-banner-btn" id="installBannerBtn" hidden>Install</button>
      <button class="install-banner-dismiss" id="installBannerDismiss" aria-label="Dismiss">&times;</button>
    </div>
  </div>

  <!-- LOGIN / ACCOUNT MODAL -->
  <div class="team-modal" id="authModal">
    <div class="team-modal-backdrop" onclick="closeAuthModal()"></div>
    <div class="team-modal-card glass auth-modal-card">
      <button class="team-modal-close" onclick="closeAuthModal()" aria-label="Close">&times;</button>
      <div id="authModalContent"></div>
    </div>
  </div>

  <div class="main-layout">
    <!-- LEFT: the leagues that have matches on the selected day -->
    <aside class="sidebar" id="sidebar">
      <h3>Leagues</h3>
      <div id="competitions"></div>
    </aside>

    <!-- CENTER: the match list -->
    <main class="content">
      <nav class="view-toggle" aria-label="Sections">
        <button id="viewMatchesBtn" class="view-toggle-btn active" onclick="setViewMode('matches')">Matches</button>
        <button id="viewTeamsBtn" class="view-toggle-btn" onclick="setViewMode('teams')">Teams</button>
        <button id="viewFavoritesBtn" class="view-toggle-btn" onclick="setViewMode('favorites')">★ Favorites</button>
        <button id="viewLeaderboardBtn" class="view-toggle-btn" onclick="setViewMode('leaderboard')">🏆 Leaderboard</button>
        <button id="viewMyPredictionsBtn" class="view-toggle-btn" onclick="setViewMode('mypredictions')">My Predictions</button>
      </nav>
      <div class="day-strip" id="dayStrip"></div>
      <div id="matches"></div>
    </main>

    <!-- RIGHT: live now + match of the day -->
    <aside class="rightbar">
      <section class="rail-card">
        <h3><span class="live-dot"></span>Live now</h3>
        <div id="liveNowList"><div class="rail-empty">Loading…</div></div>
      </section>
      <section class="rail-card">
        <h3>Match of the day</h3>
        <div id="featured"></div>
      </section>
    </aside>
  </div>

  <footer class="site-footer-full">
    <div class="footer-leagues">
      <h4>Leagues</h4>
      <div class="footer-leagues-grid" id="footerLeaguesGrid"></div>
    </div>
    <div class="site-footer">Match data from API-Football; team profiles from TheSportsDB. GoalHub 2026</div>
    <div class="footer-legal-links">
      <a href="terms">Terms of Use</a>·<a href="privacy">Privacy Policy</a>
    </div>
  </footer>

  <!-- MOBILE BOTTOM NAV (≤699px only — see .mobile-bottom-nav in styles.css) -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="Primary">
    <button class="mobile-nav-btn" onclick="resetMatchFilters(); setViewMode('matches'); window.scrollTo({top:0,behavior:'smooth'})" aria-label="Scores">
      <span class="mobile-nav-icon">⚽</span><span>Scores</span>
    </button>
    <button class="mobile-nav-btn" onclick="jumpToLive()" aria-label="Live scores">
      <span class="mobile-nav-icon">🔴</span><span>Live</span>
    </button>
    <button class="mobile-nav-btn" onclick="setViewMode('favorites'); window.scrollTo({top:0,behavior:'smooth'})" aria-label="Favorites">
      <span class="mobile-nav-icon">★</span><span>Favorites</span>
    </button>
    <button class="mobile-nav-btn" onclick="setViewMode('mypredictions'); window.scrollTo({top:0,behavior:'smooth'})" aria-label="Predictions">
      <span class="mobile-nav-icon">🔮</span><span>Predict</span>
    </button>
  </nav>

  <!-- TEAM DETAIL MODAL -->
  <div class="team-modal" id="teamModal">
    <div class="team-modal-backdrop" onclick="closeTeamModal()"></div>
    <div class="team-modal-card glass">
      <button class="team-modal-close" onclick="closeTeamModal()" aria-label="Close">&times;</button>
      <div id="teamModalContent"></div>
    </div>
  </div>

  <!-- MATCH DETAIL MODAL -->
  <div class="team-modal" id="matchModal">
    <div class="team-modal-backdrop" onclick="closeMatchModal()"></div>
    <div class="team-modal-card glass match-modal-card">
      <button class="team-modal-close" onclick="closeMatchModal()" aria-label="Close">&times;</button>
      <div id="matchModalContent"></div>
    </div>
  </div>

  <!-- LIVE NOW MATCH DETAIL MODAL (API-Football sourced) -->
  <div class="team-modal" id="liveMatchModal">
    <div class="team-modal-backdrop" onclick="closeLiveMatchModal()"></div>
    <div class="team-modal-card glass match-modal-card">
      <button class="team-modal-close" onclick="closeLiveMatchModal()" aria-label="Close">&times;</button>
      <div id="liveMatchModalContent"></div>
    </div>
  </div>

  <script src="manual-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
